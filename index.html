<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarme Brasília Web 2.0</title>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #141414;
            --text-color: #ffffff;
            --primary-color: #3b82f6;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --input-bg: #262626;
            --border-color: #333;
            --muted-color: #666;
        }

        [data-theme="light"] {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary-color: #2563eb;
            --success-color: #059669;
            --warning-color: #d97706;
            --danger-color: #dc2626;
            --input-bg: #e5e7eb;
            --border-color: #d1d5db;
            --muted-color: #9ca3af;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        .theme-toggle {
            position: absolute;
            top: 20px; right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.1); }

        .container {
            background-color: var(--card-bg);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            width: 90%;
            max-width: 450px; /* Levemente mais largo para caber o switch */
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .clock {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .timezone-label {
            font-size: 0.85rem;
            opacity: 0.6;
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
            align-items: center;
        }

        input[type="time"] {
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: var(--input-bg);
            color: var(--text-color);
            font-size: 1.3rem;
            flex-grow: 1;
            outline: none;
            transition: 0.3s;
        }
        
        [data-theme="dark"] input[type="time"] { color-scheme: dark; }
        [data-theme="light"] input[type="time"] { color-scheme: light; }

        input[type="time"]:focus { border-color: var(--primary-color); }

        button.main-btn {
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1.5rem;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .btn-add { background-color: var(--primary-color); }
        .btn-add:hover { background-color: #2563eb; }
        .btn-save { background-color: var(--success-color); }
        .btn-save:hover { opacity: 0.9; }
        button.main-btn:disabled { background-color: var(--border-color); cursor: not-allowed; }

        .cancel-edit-btn {
            background: transparent;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            width: 40px;
            height: 40px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-size: 1rem;
            justify-content: center;
            align-items: center;
        }
        .cancel-edit-btn:hover { background: var(--danger-color); color: white; }

        .alarms-list {
            list-style: none;
            padding: 0;
            margin-top: 1rem;
            max-height: 280px;
            overflow-y: auto;
        }
        .alarms-list::-webkit-scrollbar { width: 6px; }
        .alarms-list::-webkit-scrollbar-thumb { background-color: var(--border-color); border-radius: 4px; }

        .alarm-item {
            background-color: var(--input-bg);
            margin-bottom: 8px;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: 0.2s;
        }
        
        .alarm-item.editing {
            border-color: var(--warning-color);
            background-color: rgba(245, 158, 11, 0.1);
        }

        /* Estilo para alarme desativado */
        .alarm-item.paused {
            opacity: 0.5;
            background-color: transparent;
            border: 1px solid var(--border-color);
        }
        .alarm-item.paused .alarm-time {
            text-decoration: line-through;
            color: var(--muted-color);
        }

        .alarm-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .alarm-time {
            font-size: 1.4rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            transition: color 0.3s;
        }

        /* --- SWITCH TOGGLE CSS --- */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color);
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: var(--success-color);
        }
        input:checked + .slider:before {
            transform: translateX(18px);
        }
        /* ------------------------- */

        .actions { display: flex; gap: 5px; margin-left: 10px; }

        .icon-btn {
            background: transparent;
            border: none;
            font-weight: bold;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: 0.2s;
            font-size: 1.1rem;
        }

        .edit-btn { color: var(--warning-color); }
        .edit-btn:hover { background: rgba(245, 158, 11, 0.15); }
        .delete-btn { color: var(--danger-color); }
        .delete-btn:hover { background: rgba(239, 68, 68, 0.15); }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(5px);
        }
        .modal.active { display: flex; animation: fadeIn 0.3s; }

        .stop-btn {
            background-color: var(--danger-color);
            color: white;
            font-size: 1.2rem;
            padding: 15px 50px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
            font-weight: bold;
            animation: pulse 1s infinite;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">☀️</button>

    <div class="container">
        <div class="clock" id="displayClock">00:00:00</div>
        <div class="timezone-label">Horário de Brasília</div>

        <div class="input-group">
            <input type="time" id="alarmInput" required>
            <button class="cancel-edit-btn" id="cancelBtn" onclick="cancelEdit()" title="Cancelar Edição">✕</button>
            <button class="main-btn btn-add" id="actionBtn" onclick="handleAlarmAction()">+</button>
        </div>

        <ul class="alarms-list" id="alarmsList"></ul>
        <div class="limit-msg" id="limitMsg" style="opacity: 0.5; margin-top:10px; font-size:0.8rem;">Carregando...</div>
    </div>

    <div class="modal" id="alarmModal">
        <div style="font-size: 5rem;">⏰</div>
        <h2 style="color:white; margin:10px 0;">HORA DO ALARME</h2>
        <div id="alarmTimeDisplay" style="font-size: 3rem; color: var(--primary-color); font-weight: bold;">--:--</div>
        <button class="stop-btn" onclick="stopAlarm()">PARAR ALARME</button>
    </div>

    <audio id="alarmSound" loop>
        <source src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" type="audio/mpeg">
    </audio>

    <script>
        const workerCode = `
            setInterval(() => {
                postMessage('tick');
            }, 1000);
        `;
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const worker = new Worker(URL.createObjectURL(blob));

        // --- VARIÁVEIS GLOBAIS ---
        const MAX_ALARMS = 10;
        let alarms = []; // Agora será um array de objetos: { time: 'HH:MM', active: true/false }
        let audio = document.getElementById('alarmSound');
        let isRinging = false;
        let editingIndex = -1;
        
        const displayClock = document.getElementById('displayClock');
        const alarmInput = document.getElementById('alarmInput');
        const alarmsList = document.getElementById('alarmsList');
        const actionBtn = document.getElementById('actionBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        const limitMsg = document.getElementById('limitMsg');
        const modal = document.getElementById('alarmModal');
        const themeBtn = document.getElementById('themeBtn');

        worker.onmessage = function() {
            updateClock();
        };

        // --- TEMA ---
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const newTheme = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }
        function updateThemeIcon(theme) {
            themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        }

        // --- PERSISTÊNCIA E MIGRAÇÃO ---
        function loadAlarms() {
            const savedAlarms = localStorage.getItem('myAlarms');
            if (savedAlarms) {
                const parsed = JSON.parse(savedAlarms);
                // MIGRACAO: Se o formato antigo (array de strings) for detectado
                if (parsed.length > 0 && typeof parsed[0] === 'string') {
                    alarms = parsed.map(time => ({ time: time, active: true }));
                    saveAlarms(); // Salva logo no formato novo
                } else {
                    alarms = parsed;
                }
            }
            renderAlarms();
        }
        
        function saveAlarms() {
            localStorage.setItem('myAlarms', JSON.stringify(alarms));
            renderAlarms();
        }

        // --- LÓGICA DO RELÓGIO ---
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            displayClock.textContent = timeString;

            // Checa alarme quando os segundos são 00
            if (!isRinging && timeString.endsWith('00')) {
                const currentHM = timeString.substring(0, 5);
                
                // Só dispara se o horário existe E estiver ATIVO
                const foundAlarm = alarms.find(a => a.time === currentHM && a.active === true);
                
                if (foundAlarm) triggerAlarm(foundAlarm.time);
            }
        }

        // --- LÓGICA DE ADICIONAR/EDITAR ---
        function handleAlarmAction() {
            const timeVal = alarmInput.value;
            if (!timeVal) return;

            // Verifica duplicidade (ignorando o que está sendo editado)
            const exists = alarms.some((a, idx) => a.time === timeVal && idx !== editingIndex);
            if (exists) {
                return alert("Este horário já existe na lista.");
            }

            if (editingIndex > -1) {
                // Ao editar, mantemos o status ativo ou resetamos? Vamos manter o status atual se possível.
                alarms[editingIndex].time = timeVal;
                // Opcional: Forçar a ativar ao editar?
                alarms[editingIndex].active = true; 
                exitEditMode();
            } else {
                if (alarms.length >= MAX_ALARMS) return alert("Limite de 10 alarmes atingido!");
                // Cria novo objeto
                alarms.push({ time: timeVal, active: true });
            }

            sortAlarms();
            saveAlarms();
            alarmInput.value = '';
        }

        function toggleAlarmStatus(index) {
            // Inverte o status active
            alarms[index].active = !alarms[index].active;
            saveAlarms();
            // Não precisa reordenar ao pausar
        }

        function sortAlarms() {
            alarms.sort((a, b) => a.time.localeCompare(b.time));
        }

        function startEdit(index) {
            editingIndex = index;
            alarmInput.value = alarms[index].time;
            alarmInput.focus();
            actionBtn.textContent = '✓';
            actionBtn.classList.remove('btn-add');
            actionBtn.classList.add('btn-save');
            cancelBtn.style.display = 'flex';
            renderAlarms();
        }

        function cancelEdit() {
            exitEditMode();
            alarmInput.value = '';
        }

        function exitEditMode() {
            editingIndex = -1;
            actionBtn.textContent = '+';
            actionBtn.classList.remove('btn-save');
            actionBtn.classList.add('btn-add');
            cancelBtn.style.display = 'none';
            renderAlarms();
        }

        function removeAlarm(index) {
            if (index === editingIndex) exitEditMode();
            alarms.splice(index, 1);
            saveAlarms();
        }

        function renderAlarms() {
            alarmsList.innerHTML = '';
            alarms.forEach((alarmObj, index) => {
                const li = document.createElement('li');
                // Adiciona classes para estilo (editando ou pausado)
                li.className = 'alarm-item';
                if (index === editingIndex) li.classList.add('editing');
                if (!alarmObj.active) li.classList.add('paused');

                li.innerHTML = `
                    <div class="alarm-info">
                        <label class="switch" title="Ativar/Pausar">
                            <input type="checkbox" ${alarmObj.active ? 'checked' : ''} onchange="toggleAlarmStatus(${index})">
                            <span class="slider"></span>
                        </label>
                        <span class="alarm-time">${alarmObj.time}</span>
                    </div>
                    <div class="actions">
                        <button class="icon-btn edit-btn" onclick="startEdit(${index})" title="Editar">✏️</button>
                        <button class="icon-btn delete-btn" onclick="removeAlarm(${index})" title="Excluir">✕</button>
                    </div>
                `;
                alarmsList.appendChild(li);
            });
            
            limitMsg.textContent = `${alarms.length}/${MAX_ALARMS} alarmes`;
            if (editingIndex === -1) {
                actionBtn.disabled = alarms.length >= MAX_ALARMS;
            } else {
                actionBtn.disabled = false;
            }
        }

        // --- DISPARO ---
        function triggerAlarm(time) {
            isRinging = true;
            modal.classList.add('active');
            document.getElementById('alarmTimeDisplay').textContent = time;
            
            audio.currentTime = 0;
            const playPromise = audio.play();
            
            if (playPromise !== undefined) {
                playPromise.catch(error => {
                    console.log("Autoplay bloqueado. Interaja com a página.");
                    alert("⏰ ALARME: " + time);
                });
            }
        }

        function stopAlarm() {
            isRinging = false;
            modal.classList.remove('active');
            audio.pause();
            audio.currentTime = 0;
        }

        // --- INICIALIZAÇÃO ---
        initTheme();
        loadAlarms();
        updateClock();
    </script>
</body>
</html>
